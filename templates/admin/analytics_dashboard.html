<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Cinematch Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #718096;
            font-size: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #718096;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            color: #2d3748;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #a0aec0;
            font-size: 14px;
        }

        .movies-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-header h2 {
            color: #2d3748;
            font-size: 24px;
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            color: #718096;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .movies-table {
            width: 100%;
            border-collapse: collapse;
        }

        .movies-table thead {
            background: #f7fafc;
        }

        .movies-table th {
            padding: 15px;
            text-align: left;
            color: #4a5568;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .movies-table td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            color: #2d3748;
        }

        .movies-table tr:hover {
            background: #f7fafc;
        }

        .movie-title {
            font-weight: 600;
            color: #2d3748;
        }

        .movie-year {
            color: #a0aec0;
            font-size: 14px;
        }

        .genre-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .genre-tag {
            display: inline-block;
            padding: 2px 8px;
            background: #e6fffa;
            color: #047857;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .score-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .score-high {
            background: #c6f6d5;
            color: #22543d;
        }

        .score-medium {
            background: #feebc8;
            color: #7c2d12;
        }

        .score-low {
            background: #fed7d7;
            color: #742a2a;
        }

        .sources-list {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .source-tag {
            background: #edf2f7;
            color: #4a5568;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .coverage-bar {
            background: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .coverage-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .search-container {
            margin-bottom: 25px;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎬 Analytics Dashboard</h1>
            <p>Movie Data Aggregation & Quality Scoring System</p>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Movies</h3>
                <div class="value" id="total-movies">-</div>
                <div class="label">In database</div>
            </div>
            <div class="stat-card">
                <h3>Aggregated Scores</h3>
                <div class="value" id="aggregated-count">-</div>
                <div class="label">With weighted scores</div>
            </div>
            <div class="stat-card">
                <h3>Average Score</h3>
                <div class="value" id="avg-score">-</div>
                <div class="label">Overall quality</div>
            </div>
            <div class="stat-card">
                <h3>Data Sources</h3>
                <div class="value" id="source-count">-</div>
                <div class="label">Active scrapers</div>
            </div>
        </div>

        <!-- Top Movies Section -->
        <div class="movies-section">
            <div class="section-header">
                <h2>Top Rated Movies</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label>Genre</label>
                        <select id="genre">
                            <option value="">All Genres</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Year From</label>
                        <input type="number" id="year-from" placeholder="2020" value="2020">
                    </div>
                    <div class="filter-group">
                        <label>Year To</label>
                        <input type="number" id="year-to" placeholder="2025" value="2025">
                    </div>
                    <div class="filter-group">
                        <label>Limit</label>
                        <select id="limit">
                            <option value="10">10 movies</option>
                            <option value="20" selected>20 movies</option>
                            <option value="50">50 movies</option>
                            <option value="100">100 movies</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>&nbsp;</label>
                        <button onclick="loadTopMovies()">Apply Filters</button>
                    </div>
                </div>
            </div>

            <div class="search-container">
                <input type="text" class="search-box" id="search-box" placeholder="🔍 Search movies by title...">
            </div>

            <div id="movies-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading movies...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allMovies = [];

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch('/api/analytics/stats');
                const data = await response.json();

                if (data.success) {
                    const stats = data.statistics;
                    document.getElementById('total-movies').textContent = stats.total_movies.toLocaleString();
                    document.getElementById('aggregated-count').textContent = stats.aggregated_movies.toLocaleString();
                    document.getElementById('avg-score').textContent = stats.average_score ? stats.average_score.toFixed(1) : 'N/A';
                    document.getElementById('source-count').textContent = Object.keys(stats.source_counts).length;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load top movies
        async function loadTopMovies() {
            const yearFrom = document.getElementById('year-from').value;
            const yearTo = document.getElementById('year-to').value;
            const limit = document.getElementById('limit').value;
            const genre = document.getElementById('genre').value;

            const container = document.getElementById('movies-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading movies...</p></div>';

            try {
                const params = new URLSearchParams({
                    limit: limit,
                    year_from: yearFrom,
                    year_to: yearTo
                });

                if (genre) {
                    params.append('genre', genre);
                }

                const response = await fetch(`/api/analytics/top-movies?${params}`);
                const data = await response.json();

                if (data.success && data.movies.length > 0) {
                    allMovies = data.movies;
                    renderMovies(allMovies);
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path>
                            </svg>
                            <h3>No movies found</h3>
                            <p>Try adjusting your filters</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading movies:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="color: #e53e3e;">Error loading movies. Please try again.</p>
                    </div>
                `;
            }
        }

        // Render movies table
        function renderMovies(movies) {
            const container = document.getElementById('movies-container');

            if (movies.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No matches found</h3>
                        <p>Try a different search term</p>
                    </div>
                `;
                return;
            }

            const html = `
                <table class="movies-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Movie</th>
                            <th>Score</th>
                            <th>Coverage</th>
                            <th>Sources</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${movies.map((movie, index) => {
                            const scoreClass = movie.score >= 80 ? 'score-high' :
                                             movie.score >= 60 ? 'score-medium' : 'score-low';

                            return `
                                <tr>
                                    <td><strong>#${index + 1}</strong></td>
                                    <td>
                                        <div class="movie-title">${movie.title}</div>
                                        <div class="movie-year">${movie.year}${movie.runtime ? ` • ${movie.runtime} min` : ''}</div>
                                        ${movie.genres ? `
                                            <div class="genre-tags">
                                                ${movie.genres.map(g => `<span class="genre-tag">${g}</span>`).join('')}
                                            </div>
                                        ` : ''}
                                    </td>
                                    <td>
                                        <span class="score-badge ${scoreClass}">${movie.score.toFixed(1)}/100</span>
                                    </td>
                                    <td>
                                        <div class="coverage-bar">
                                            <div class="coverage-fill" style="width: ${movie.coverage}%"></div>
                                        </div>
                                        <small style="color: #a0aec0;">${movie.coverage.toFixed(0)}%</small>
                                    </td>
                                    <td>
                                        <div class="sources-list">
                                            ${movie.sources.map(source =>
                                                `<span class="source-tag">${source}</span>`
                                            ).join('')}
                                        </div>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // Search functionality
        document.getElementById('search-box').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();

            if (searchTerm === '') {
                renderMovies(allMovies);
                return;
            }

            const filtered = allMovies.filter(movie =>
                movie.title.toLowerCase().includes(searchTerm)
            );

            renderMovies(filtered);
        });

        // Load genres for dropdown
        async function loadGenres() {
            try {
                const response = await fetch('/api/analytics/genres');
                const data = await response.json();

                if (data.success && data.genres.length > 0) {
                    const select = document.getElementById('genre');
                    data.genres.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.genre;
                        option.textContent = `${item.genre} (${item.count})`;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading genres:', error);
            }
        }

        // Initial load
        loadStats();
        loadGenres();
        loadTopMovies();

        // Refresh every 60 seconds
        setInterval(loadStats, 60000);
    </script>
</body>
</html>
